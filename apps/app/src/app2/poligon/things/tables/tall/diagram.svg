<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420">
  <style>
    .c{fill:none;stroke:#1a1a1a;stroke-width:2}
    .p{fill:#e8e2d4;stroke:#1a1a1a;stroke-width:2}
    .air{fill:#cfe6dc;opacity:.55}
    .d{stroke:#00815c;stroke-width:1.2;marker-start:url(#a);marker-end:url(#a)}
    .t{font:600 15px system-ui,sans-serif;fill:#1a1a1a}
    .n{font:600 13px system-ui,sans-serif;fill:#00815c}
    .m{font:500 11.5px ui-monospace,monospace;fill:#6b6355}
  </style>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
    <path d="M0,3.5 L7,0 L7,7 Z" fill="#00815c"/></marker></defs>
  <text class="t" x="20" y="26">Пенал · сквозная вентшахта · вид сбоку</text>

  <line x1="40" y1="50" x2="520" y2="50" stroke="#1a1a1a" stroke-width="3"/>
  <text class="m" x="44" y="44">потолок</text>

  <rect class="c" x="120" y="70" width="300" height="300"/>
  <rect class="air" x="370" y="70" width="50" height="300"/>
  <text class="m" x="430" y="220">шахта 50</text>

  <!-- выход наверху -->
  <rect class="air" x="120" y="70" width="300" height="16"/>
  <text class="n" x="180" y="64">выход ≥ 200 см²</text>

  <!-- усечённые полки -->
  <rect class="p" x="120" y="150" width="250" height="12"/>
  <rect class="p" x="120" y="240" width="250" height="12"/>
  <text class="m" x="150" y="182">полка усечена на 50</text>
  <line class="d" x1="370" y1="200" x2="420" y2="200"/>

  <!-- техника без задней стенки -->
  <rect class="c" x="130" y="262" width="235" height="100" stroke-dasharray="5 4"/>
  <text class="m" x="150" y="316">холодильник — ХДФ НЕТ</text>

  <!-- вход в цоколе -->
  <rect class="p" x="120" y="370" width="300" height="26"/>
  <rect class="air" x="300" y="372" width="100" height="22"/>
  <text class="n" x="252" y="414">вход в цоколе ≥ 200 см²</text>

  <text class="m" x="20" y="66">воздух идёт снизу вверх непрерывно: вход · мимо усечённых полок · выход</text>
</svg>
