  <text class="m" x="66" y="358">дно</text>
  <text class="m" x="215" y="349">Y = 0</text>

  <g class="h">
    <circle cx="95" cy="313" r="5"/><circle cx="95" cy="281" r="5"/>
    <circle cx="95" cy="249" r="5"/><circle cx="95" cy="217" r="5"/>
