<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <style>
    .c{fill:none;stroke:#1a1a1a;stroke-width:2}
    .p{fill:#e8e2d4;stroke:#1a1a1a;stroke-width:2}
    .t{fill:#cfe6dc;stroke:#00815c;stroke-width:2}
    .d{stroke:#00815c;stroke-width:1.2;marker-start:url(#a);marker-end:url(#a)}
    .r{stroke:#e53935;stroke-width:2}
    .h{font:600 15px system-ui,sans-serif;fill:#1a1a1a}
    .n{font:600 13px system-ui,sans-serif;fill:#00815c}
    .m{font:500 11.5px ui-monospace,monospace;fill:#6b6355}
    .x{font:600 12px ui-monospace,monospace;fill:#e53935}
  </style>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
    <path d="M0,3.5 L7,0 L7,7 Z" fill="#00815c"/></marker></defs>

  <text class="h" x="20" y="26">Остров · опрокидывание · вид сбоку</text>

  <!-- столешница со свесом -->
  <rect class="t" x="90" y="70" width="380" height="22"/>
  <text class="m" x="392" y="64">свес</text>
  <line class="d" x1="360" y1="54" x2="470" y2="54"/>

  <!-- корпус -->
  <rect class="c" x="120" y="92" width="240" height="180"/>
  <text class="m" x="150" y="116">корпус 600</text>

  <!-- цоколь утоплен -->
  <rect class="p" x="150" y="272" width="180" height="28"/>
  <text class="m" x="336" y="292">цоколь утоплен</text>

  <!-- открытый ящик -->
  <rect class="p" x="300" y="140" width="190" height="60"/>
  <text class="m" x="360" y="176">открытый ящик</text>
  <path d="M490,150 l0,-18 l14,0" fill="none" class="r"/>
  <text class="x" x="496" y="128">груз</text>

  <!-- ребро опрокидывания -->
  <circle cx="330" cy="300" r="6" fill="#e53935"/>
  <text class="x" x="300" y="330">ребро</text>

  <!-- плечи -->
  <line class="d" x1="330" y1="352" x2="490" y2="352"/>
  <text class="n" x="378" y="372">плечо груза</text>
  <line class="d" x1="150" y1="352" x2="330" y2="352"/>
  <text class="n" x="176" y="372">половина глубины</text>

  <text class="m" x="20" y="392">удерживает: собственный вес × половина глубины ДО РЕБРА · утопить цоколь = сдвинуть ребро назад</text>
</svg>
