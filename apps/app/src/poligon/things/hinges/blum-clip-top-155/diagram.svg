<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300">
  <style>
    .c{fill:none;stroke:#1a1a1a;stroke-width:2}
    .f{fill:#e8e2d4;stroke:#1a1a1a;stroke-width:2}
    .d{stroke:#00815c;stroke-width:1.2;marker-start:url(#a);marker-end:url(#a)}
    .t{font:600 15px system-ui,sans-serif;fill:#1a1a1a}
    .n{font:500 13px system-ui,sans-serif;fill:#00815c}
    .m{font:500 12px ui-monospace,monospace;fill:#6b6355}
  </style>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
    <path d="M0,3.5 L7,0 L7,7 Z" fill="#00815c"/></marker></defs>
  <text class="t" x="20" y="28">CLIP top 155° · без вхождения в проём · вид сверху</text>

  <rect class="c" x="120" y="60" width="330" height="150"/>
  <rect class="f" x="120" y="60" width="16" height="150"/>
  <text class="m" x="146" y="80">корпус</text>

  <!-- door swung to 155: lies outside the opening -->
  <rect class="f" x="86" y="46" width="18" height="120" transform="rotate(-25 95 106)"/>
  <text class="m" x="30" y="200">фасад на 155°</text>

  <line class="d" x1="136" y1="240" x2="136" y2="270"/>
  <text class="n" x="146" y="262">вхождение 0 — проём свободен</text>

  <rect class="f" x="150" y="96" width="270" height="80"/>
  <text class="m" x="250" y="142">внутренний ящик выезжает</text>

  <text class="m" x="60" y="292">на 110° створка вошла бы в проём на ~30 мм и ящик ударил бы в неё</text>
</svg>
