<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Открой на Redmi</title>
<style>
  body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:-apple-system,system-ui,sans-serif;background:#13120e;color:#ece5d6;gap:18px}
  .card{background:#fff;padding:24px;border-radius:20px}
  #qr{width:300px;height:300px}
  h1{font-size:22px;font-weight:600;margin:0}
  .url{font-family:ui-monospace,monospace;font-size:20px;color:#e0b878;background:rgba(255,255,255,.06);padding:10px 18px;border-radius:10px}
  p{color:#9a9484;font-size:14px;margin:0}
</style></head>
<body>
  <h1>Сканируй камерой Redmi</h1>
  <div class="card"><canvas id="qr"></canvas></div>
  <div class="url">http://10.100.48.158:8088</div>
  <p>Тот же Wi-Fi · откроется галерея Mebelchi UI</p>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script>
    new QRious({ element: document.getElementById('qr'), value: 'http://10.100.48.158:8088', size: 300, level: 'M' });
  </script>
</body></html>
